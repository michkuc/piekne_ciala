name: Site regression suite

on:
  pull_request:
  push:
    branches: [main, fix/stage-a-stabilization-20261008, feat/stage-c-playlist-share-20261009]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/playlist-state.js
          node --check assets/playlist-ui.js
          node --check api/story.js
          node --check assets/login.js
          node --check assets/lab.js
          node --check assets/manual.js
          node --check api/access.js
      - name: Run site regression tests
        run: node --test tests/stage-a.test.cjs tests/stage-b.test.cjs tests/stage-c.test.cjs tests/stage-c-ui.test.cjs
